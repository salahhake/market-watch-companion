name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install --legacy-peer-deps --no-package-lock
      - run: npm install @capacitor-community/admob --legacy-peer-deps --no-package-lock
      - run: npm run build:static
      - run: |
          [ -d android ] || npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          grep -q "gms.ads.APPLICATION_ID" $M || sed -i 's#</application>#        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-6729453537876541~8247325489"/>\n    </application>#' $M
          pip install pillow
          python make_icons.py
          npx @capacitor/assets generate --android
          npx cap sync android
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Souk-Prices.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Souk Prices v${{ github.run_number }}
          files: Souk-Prices.apk
